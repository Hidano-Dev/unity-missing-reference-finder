# =============================================================================
# 既存プロジェクト更新ワークフロー
# -----------------------------------------------------------------------------
# 生成されたリポジトリに常駐する。Actions タブから手動実行し、
# リポジトリ直下の既存 Unity プロジェクトに対して次を行う (どちらか一方でも両方でも可)。
#   - project : 変更対象のプロジェクト (現在のディレクトリ名)。下記「対象プロジェクトの選び方」参照
#   - name    : 変更後のプロジェクト名。ディレクトリ名 (git mv) と ProjectSettings.asset の
#               productName をこの名前へ揃える
#   - version : 変更後の Unity バージョン。ProjectVersion.txt を書き換え、manifest.json の
#               公式 UPM パッケージを対象 Editor 適合版へその場更新する
#               (サードパーティ・scopedRegistries は温存)。changeset の指定は不要。
#               存在しないバージョンはエラーで停止する
#
# 対象プロジェクトの選び方:
#   - project 入力が空 (既定) → リポジトリ直下のプロジェクトを自動検出する。
#     1 つだけなら迷わず使え、複数ある場合は候補一覧を表示してエラー停止する。
#   - project 入力あり     → そのディレクトリを対象にする (存在しなければ候補一覧付きでエラー)。
#
# ※ workflow_dispatch の choice 型はリポジトリ内容から動的に生成できない
#    (選択肢を YAML に静的に書く必要がある) ため、自動検出 + 候補提示で代替している。
# ※ 最初のプロジェクトは Template Init がリポジトリ名で自動作成している。
#    新しいプロジェクトを増やす場合は Add Another Project を使う。
# =============================================================================
name: Update Project

on:
  workflow_dispatch:
    inputs:
      project:
        description: '変更対象のプロジェクト名 (現在のディレクトリ名。プロジェクトが 1 つしか無ければ空欄で自動検出)'
        required: false
        type: string
        default: ''
      name:
        description: '変更後のプロジェクト名 (ディレクトリ名と productName を書き換える。変更しないなら空欄)'
        required: false
        type: string
        default: ''
      version:
        description: '変更後の Unity バージョン (例: 6000.0.32f1。変更しないなら空欄)'
        required: false
        type: string
        default: ''

jobs:
  update-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 自由入力テキストはシェルへ直接展開せず env 経由で渡す
    env:
      NEW_NAME: ${{ inputs.name }}
      NEW_VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4

      # ── 入力チェック (name / version のどちらかは必須) ──────
      - name: Validate inputs
        run: |
          if [ -z "$NEW_NAME" ] && [ -z "$NEW_VERSION" ]; then
            echo "::error::name (変更後のプロジェクト名) と version (変更後の Unity バージョン) のどちらも空欄です。少なくとも一方を指定してください"
            exit 1
          fi

      # ── 対象プロジェクトの決定 (自動検出 or 入力検証) ──────
      - name: Detect project directory
        id: detect
        run: |
          mapfile -t projects < <(find . -mindepth 3 -maxdepth 3 -type f -path './*/ProjectSettings/ProjectVersion.txt' | cut -d/ -f2 | sort)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::Unity プロジェクトが見つかりません"
            exit 1
          fi
          if [ -n "$TARGET" ]; then
            if [ ! -f "$TARGET/ProjectSettings/ProjectVersion.txt" ]; then
              echo "::error::'$TARGET' は Unity プロジェクトとして見つかりません。候補: ${projects[*]}"
              exit 1
            fi
            echo "dir=$TARGET" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#projects[@]}" -gt 1 ]; then
            echo "::error::プロジェクトが複数あるため対象を自動判別できません。project 入力に次のいずれかを指定して再実行してください: ${projects[*]}"
            exit 1
          fi
          echo "dir=${projects[0]}" >> "$GITHUB_OUTPUT"

      # ── ① 名前の変更 (ディレクトリ名 + productName) ────────
      #    以降のステップは変更後のディレクトリ名 (steps.rename.outputs.dir) を使う
      - name: Rename project
        id: rename
        env:
          CUR_DIR: ${{ steps.detect.outputs.dir }}
        run: |
          if [ -z "$NEW_NAME" ]; then
            echo "dir=$CUR_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/rename-project.sh "$CUR_DIR" "$NEW_NAME"
          echo "dir=$NEW_NAME" >> "$GITHUB_OUTPUT"

      # ── ② Unity バージョンの変更 (差分がある時だけ) ─────────
      #    ProjectVersion.txt + manifest.json 公式パッケージの適合更新
      - name: Apply Unity version
        env:
          DIR: ${{ steps.rename.outputs.dir }}
        run: |
          if [ -z "$NEW_VERSION" ]; then
            exit 0
          fi
          CURRENT=$(awk '/^m_EditorVersion:/{print $2; exit}' "$DIR/ProjectSettings/ProjectVersion.txt")
          if [ "$CURRENT" = "$NEW_VERSION" ]; then
            echo "Unity $CURRENT (変更なし) : $DIR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash .github/scripts/set-unity-version.sh "$DIR" "$NEW_VERSION"

      - name: Commit
        env:
          CUR_DIR: ${{ steps.detect.outputs.dir }}
          DIR: ${{ steps.rename.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          parts=()
          if [ -n "$NEW_NAME" ] && [ "$CUR_DIR" != "$NEW_NAME" ]; then
            parts+=("rename $CUR_DIR to $NEW_NAME")
          elif [ -n "$NEW_NAME" ]; then
            parts+=("set productName to $NEW_NAME")
          fi
          if [ -n "$NEW_VERSION" ]; then
            parts+=("set Unity version to $NEW_VERSION")
          fi
          msg=$(IFS=,; echo "${parts[*]}")
          git commit -m "chore($DIR): ${msg//,/, }"
          git push
